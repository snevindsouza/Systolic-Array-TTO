# Tiny Tapeout project information
project:
  title:        "Systolic Array - 4x4 Matrix Multiplier"      # Project title
  author:       "Snevin Leoneel Dsouza"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Output-stationary systolic array computing C = A*B for 4x4 matrices of 4-bit unsigned integers, with a byte-serial load/compute/read interface"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     25000000  # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_systolic_mm"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "systolic_array.v"
    - "pe.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "DATA_IN[0]"
  ui[1]: "DATA_IN[1]"
  ui[2]: "DATA_IN[2]"
  ui[3]: "DATA_IN[3]"
  ui[4]: "unused (DW=4)"
  ui[5]: "unused (DW=4)"
  ui[6]: "unused (DW=4)"
  ui[7]: "unused (DW=4)"

  # Outputs
  uo[0]: "DATA_OUT[0]"
  uo[1]: "DATA_OUT[1]"
  uo[2]: "DATA_OUT[2]"
  uo[3]: "DATA_OUT[3]"
  uo[4]: "DATA_OUT[4]"
  uo[5]: "DATA_OUT[5]"
  uo[6]: "DATA_OUT[6]"
  uo[7]: "DATA_OUT[7]"

  # Bidirectional pins
  uio[0]: "LOAD_A (in)"
  uio[1]: "LOAD_B (in)"
  uio[2]: "START (in)"
  uio[3]: "READ (in)"
  uio[4]: "BUSY (out)"
  uio[5]: "DONE (out)"
  uio[6]: "unused (out, 0)"
  uio[7]: "unused (out, 0)"

# Do not change!
yaml_version: 6
